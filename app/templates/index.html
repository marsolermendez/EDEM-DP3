<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda Online Definitiva</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
  <div class="container mx-auto p-4 md:p-8">
    <header class="text-center mb-8">
      <h1 class="text-4xl font-bold text-gray-800">Data Project 3</h1>
      <p class="text-gray-600">Mar Soler</p>
    </header>

    <div id="mensaje-usuario" class="mb-4 text-center"></div>

    <section class="mb-12 bg-white p-6 rounded-lg shadow-md">
      <h2 class="text-2xl font-bold text-gray-800 mb-4">Añadir Nuevo Producto</h2>
      <form id="form-nuevo-producto" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label for="nombre" class="block text-sm font-medium text-gray-700">Nombre</label>
          <input type="text" id="nombre" name="nombre" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm" />
        </div>
        <div>
          <label for="stock" class="block text-sm font-medium text-gray-700">Stock Inicial</label>
          <input type="number" id="stock" name="stock" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm" />
        </div>
        <div class="md:col-span-2 text-right">
          <button type="submit" class="inline-flex justify-center rounded-md border border-transparent bg-indigo-600 py-2 px-4 text-sm font-medium text-white shadow-sm hover:bg-indigo-700">Añadir Producto</button>
        </div>
      </form>
    </section>

    <main id="lista-productos" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const listaProductosEl = document.getElementById('lista-productos');
      const mensajeUsuarioEl = document.getElementById('mensaje-usuario');
      const formNuevoProducto = document.getElementById('form-nuevo-producto');
      const API_PROXY_URL = '/api';

      formNuevoProducto.addEventListener('submit', async (event) => {
        event.preventDefault();
        const nombre = event.target.nombre.value;
        const stock = parseInt(event.target.stock.value);

        try {
          const response = await fetch(`${API_PROXY_URL}/products`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre, stock })
          });
          const data = await response.json();

          if (!response.ok) throw new Error(data.error);

          mostrarMensaje('¡Producto añadido con éxito!', 'success');
          event.target.reset();
          cargarProductos();
        } catch (error) {
          mostrarMensaje(error.toString(), 'error');
        }
      });

      async function cargarProductos() {
        listaProductosEl.innerHTML = '<p class="text-center col-span-full">Cargando productos...</p>';
        try {
          const response = await fetch(`${API_PROXY_URL}/products`);
          const productos = await response.json();

          if (!Array.isArray(productos)) throw new Error("Respuesta inesperada de productos");

          if (productos.length === 0) {
            listaProductosEl.innerHTML = '<p class="text-center col-span-full">No hay productos disponibles.</p>';
            return;
          }

          listaProductosEl.innerHTML = '';

          productos.forEach(producto => {
            const stockClass = producto.stock > 5 ? 'text-green-600' : 'text-red-600';
            const isAgotado = producto.stock === 0;

            const productoCard = document.createElement('div');
            productoCard.className = 'product-card bg-white rounded-lg overflow-hidden shadow-lg flex flex-col';
            productoCard.innerHTML = `
              <div class="p-6 flex-grow flex flex-col">
                <h2 class="text-2xl font-bold text-gray-800 mb-2">${producto.nombre} (ID: ${producto.id})</h2>
                <div class="flex justify-between items-center mt-auto pt-4">
                  <p class="text-xl font-semibold ${stockClass}">Stock: ${producto.stock}</p>
                  <button class="btn-buy bg-indigo-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-indigo-700 ${isAgotado ? 'disabled' : ''}" data-id="${producto.id}" ${isAgotado ? 'disabled' : ''}>${isAgotado ? 'Agotado' : 'Comprar'}</button>
                </div>
              </div>`;
            listaProductosEl.appendChild(productoCard);
          });
        } catch (err) {
          listaProductosEl.innerHTML = `<p class="text-center col-span-full text-red-500">Error: ${err.message}</p>`;
        }
      }

      listaProductosEl.addEventListener('click', (event) => {
        if (event.target.classList.contains('btn-buy') && !event.target.disabled) {
          const id = event.target.dataset.id;
          comprarProducto(id);
        }
      });

      async function comprarProducto(id) {
        try {
          const response = await fetch(`${API_PROXY_URL}/comprar`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ producto_id: parseInt(id) })
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error);
          mostrarMensaje('¡Compra realizada con éxito!', 'success');
          cargarProductos();
        } catch (err) {
          mostrarMensaje(err.toString(), 'error');
        }
      }

      function mostrarMensaje(texto, tipo = 'success') {
        const colorClass = tipo === 'success' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800';
        mensajeUsuarioEl.innerHTML = `<div class="${colorClass} p-3 rounded-lg">${texto}</div>`;
        setTimeout(() => { mensajeUsuarioEl.innerHTML = ''; }, 3000);
      }

      cargarProductos();
    });
  </script>
</body>
</html>
